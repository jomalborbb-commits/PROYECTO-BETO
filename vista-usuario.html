<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista de usuario — CRF &amp; LADRILLOS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  /* Espacio reservado para la página que verá el usuario o comprador.
     Usa la misma paleta del sistema (terracota, crema, arena y verde). */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "Poppins", system-ui, sans-serif;
    color: #3B2F2A;
    background: linear-gradient(160deg, #F8F1E8 0%, #F0E4D4 55%, #EADBC9 100%);
  }

  .tarjeta {
    width: min(720px, 100%);
    overflow: hidden;
    border-radius: 20px;
    background: rgba(255, 253, 249, 0.96);
    border: 1px solid #EFE4D6;
    box-shadow: 0 10px 34px rgba(120, 80, 50, 0.14);
    text-align: center;
  }

  .banner {
    height: 150px;
    background: url("assets/img/hero-patio.jpg") center bottom / cover no-repeat;
    -webkit-mask-image: linear-gradient(0deg, #000 60%, transparent 100%);
    mask-image: linear-gradient(0deg, #000 60%, transparent 100%);
  }

  .contenido { padding: 0 32px 34px; margin-top: -20px; }

  .logo { width: 84px; height: 84px; }

  h1 { margin: 10px 0 6px; font-size: clamp(24px, 4vw, 32px); font-weight: 600; }
  .marca { margin: 0; color: #7A6A60; font-size: 14px; letter-spacing: 0.04em; }

  .aviso {
    display: inline-block;
    margin: 22px 0 8px;
    padding: 6px 16px;
    border-radius: 999px;
    background: #FBEBC8;
    color: #8A5E0B;
    font-size: 12.5px;
    font-weight: 600;
  }

  p.texto { margin: 12px auto 0; max-width: 520px; color: #7A6A60; font-size: 14.5px; line-height: 1.6; }

  .volver {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 26px;
    padding: 12px 24px;
    border-radius: 999px;
    background: linear-gradient(180deg, #B4624B 0%, #9C4E38 100%);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 8px 18px rgba(140, 70, 51, 0.3);
  }

  .volver:hover { filter: brightness(1.07); }
  .volver:focus-visible { outline: 3px solid #A9573F; outline-offset: 3px; }
</style>
</head>
<body>
  <main class="tarjeta">
    <div class="banner" aria-hidden="true"></div>
    <div class="contenido">
      <img class="logo" src="assets/img/logo-crf.png" alt="Logo de CRF">
      <h1>Vista de usuario</h1>
      <p class="marca">CRF &amp; LADRILLOS S.A.C.</p>
      <span class="aviso">Próximamente</span>
      <p class="texto">Aquí se construirá la página que verá tu usuario o comprador. Por ahora es un espacio reservado: todo lo del sistema sigue funcionando en el panel principal.</p>
      <a class="volver" id="volver" href="index.html">← Volver al sistema</a>
    </div>
  </main>

  <script>
    // Si venimos del sistema, se vuelve atrás (sin repetir la pantalla de bienvenida); si no, se abre el sistema
    document.getElementById("volver").addEventListener("click", function (e) {
      if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    });
  </script>
</body>
</html>
